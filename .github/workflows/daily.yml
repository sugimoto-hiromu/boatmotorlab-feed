# 配信用リポジトリ(データ専用・公開)に置く GitHub Actions。毎日 JST 07:30 に更新して GitHub Pages に公開する。
# 使い方は docs/DATA_DELIVERY.md。scripts/ の3ファイルを同じリポジトリの scripts/ にコピーして使う。
name: daily-data
on:
  schedule: [{ cron: "30 22 * * *" }]   # UTC 22:30 = JST 07:30
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: actions/cache@v4
        with: { path: work, key: mbrace-raw-${{ github.run_id }}, restore-keys: mbrace-raw- }
      - run: python3 -I scripts/daily_update.py work site
      - run: cp docs/legal/privacy-policy.html site/privacy-policy.html || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
